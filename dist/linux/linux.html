        <section  ><!--
第一階段：Ubuntu
每天讓終端成為主入口。能用 CLI 的不用 GUI。

窗口控制
Super 鍵（打開應用搜索）
Alt + Tab 切換窗口
Super + 方向鍵 分屏
Ctrl + Alt + T 打開終端

文件操作
cd
ls
mv
cp
rm
mkdir

Shell 強化
Tab 自動補全
history + Ctrl + r 反向搜索命令
alias（給長命令起短名字）


7 天 Ubuntu 鍵盤戒鼠計劃
環境：Ubuntu GNOME
工具：終端 + 系統快捷鍵
規則：每天至少 60 分鐘全鍵盤

第 1 天：窗口控制日
目標：不碰滑鼠完成所有窗口操作。

Super → 搜索並打開應用
Alt + Tab → 切換窗口
Super + ← / → → 分屏
Super + ↑ / ↓ → 最大化 / 還原
Ctrl + Alt + T → 打開終端

第 2 天：終端文件日
今天幾乎只用終端管理文件。
練：pwd
ls
cd
mkdir
mv
cp
rm
touch
任務：
在終端裡建一個小說資料夾結構，例如：
novel/
 ├── outline/
 ├── chapter/
 ├── notes/

全程不用文件管理器。


第 3 天：命令記憶日
學會讓終端成為延伸大腦。
練：
history
Ctrl + r（反向搜索命令）
Tab 補全
上下方向鍵調出歷史命令
今天重點不是做事。
是讓手指記住命令節奏。

第 4 天：文本編輯日（先用 nano 或 vim 都可）
只做一件事：
用終端編輯文件。
打開
編輯
保存
退出
禁止打開圖形編輯器。
目標：打字 → 保存 → 關閉 成為自然流程。

第 5 天：系統設置日

今天練自定義快捷鍵。

Ubuntu 設置 → 鍵盤 → 快捷鍵

給常用應用設置快捷鍵：

例如：

打開終端

打開瀏覽器

打開文件夾

今天目標：

所有常用程序都能鍵盤啟動。

第 6 天：滑鼠隔離日

今天：

把滑鼠拔掉。

不是放旁邊。

是真的拔掉。

如果某件事做不到：

查方法
改快捷鍵
用終端替代

這一天會暴露所有弱點。

很好。

第 7 天：整合日

今天做一個完整流程：

開機

打開終端

建立文件

編輯

提交 Git（如果會）

關閉程序

全程不碰滑鼠。

如果能完成，你已經脫離依賴。








 
第二階段： Neovim 熟練

熟悉 Vim 模式思維
熟悉終端工作流
學會 tmux / shell 操作
建立自己的快捷鍵習慣


第三層：窗口管理器（真正純鍵盤）
i3
sway
或者 GNOME 自定義快捷鍵
 
第三階段：鍵盤工作流完整化
學習鍵盤驅動系統。
window manager 快捷鍵
shell alias
fzf
ripgrep
git CLI
lazygit

第三階段：再裝 Arch
能讀 wiki
能排錯
能接受黑屏


建立小說專用配置
Markdown 支持
自動換行
字數統計
文件跳轉
搜索角色名
章節導航
Git 管理版本

終端生態
bash / zsh
tmux
fzf
ripgrep
git CLI
 
-->
