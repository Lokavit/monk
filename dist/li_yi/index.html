<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离异后被千亿总裁独宠 · 书库 · Lokavit's Personal Site</title>
    <link rel="stylesheet" href="../../assets/main.css" />
    <style>
      /* ==================== 基础变量（与首页一致） ==================== */
      :root {
        --background: #121212;
        --foreground: #4eee85;
        --accent: #4eee85;
        --accent-hover: #8dffb4;
        --accent-rgb: 78, 238, 133;
        --accent-bg: rgba(78, 238, 133, 0.1);
        --accent-bg-hover: rgba(78, 238, 133, 0.16);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.65);
        --radius: 8px;
      }

      /* ==================== 重置 ==================== */
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        background: var(--background);
        color: var(--text);
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
          system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: 40px 24px 80px;
        text-align: left;
      }

      /* ==================== 顶部固定栏 ==================== */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        width: 100%;
        background: rgba(18, 18, 18, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px dashed rgba(var(--accent-rgb), 0.15);
      }

      .site-header .container {
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand {
        color: var(--text);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-decoration: none;
      }

      .header-nav { display: flex; flex-wrap: wrap; gap: 6px; }

      .header-nav a {
        padding: 6px 14px;
        border-radius: 6px;
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 1px;
        text-decoration: none;
        transition: color 0.25s ease, background 0.25s ease;
      }

      .header-nav a:hover {
        color: var(--accent);
        background: var(--accent-bg);
      }

      .search {
        padding: 6px 14px;
        border: 1px solid rgba(var(--accent-rgb), 0.2);
        border-radius: 6px;
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 1px;
        white-space: nowrap;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .search:hover {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-bg);
      }

      /* ==================== 区块标题 ==================== */
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-top: 3em;
        scroll-margin-top: 100px;
      }

      .section-head .title {
        margin: 0;
        color: var(--accent);
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 2px;
      }

      .section-head .count,
      .section-head .more {
        color: var(--foreground);
        font-family: "Courier New", Courier, monospace;
        font-size: 0.7rem;
        letter-spacing: 1px;
        opacity: 0.45;
        white-space: nowrap;
        text-decoration: none;
        transition: color 0.25s ease, opacity 0.25s ease;
      }

      .section-head .count:hover,
      .section-head .more:hover {
        color: var(--accent-hover);
        opacity: 1;
      }

      .line-dashed {
        margin: 12px 0 0;
        border: none;
        border-top: 1px dashed rgba(var(--accent-rgb), 0.2);
      }

      /* ==================== 书籍详情卡片 ==================== */
      .book-detail {
        display: block;
        margin-top: 20px;
        padding: 24px;
        border: 1px solid rgba(var(--accent-rgb), 0.45);
        border-radius: var(--radius);
        background: rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .book-title {
        margin: 0 0 16px;
        color: var(--accent);
        font-size: 1.6rem;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: 1px;
      }

      .book-meta {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }

      .meta-line {
        color: rgba(255, 255, 255, 0.55);
        font-family: "Courier New", Courier, monospace;
        font-size: 0.75rem;
        line-height: 1.7;
        letter-spacing: 0.5px;
      }

      .meta-line.main {
        color: var(--foreground);
        opacity: 0.85;
      }

      .meta-line .label {
        color: rgba(255, 255, 255, 0.4);
      }

      .chip {
        display: inline-block;
        margin: 2px 6px 2px 0;
        padding: 1px 8px;
        border: 1px solid rgba(var(--accent-rgb), 0.25);
        border-radius: 999px;
        font-size: 0.7rem;
        color: var(--foreground);
        opacity: 0.7;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .chip:hover {
        opacity: 1;
        color: var(--accent-hover);
        border-color: var(--accent);
        background: var(--accent-bg);
      }

      .book-intro {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(var(--accent-rgb), 0.25);
      }

      .book-intro-title {
        color: var(--accent);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .book-intro p {
        margin: 0;
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.8rem;
        line-height: 1.9;
        letter-spacing: 0.5px;
      }

      /* ==================== 章节目录 ==================== */
      .chapter-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 10px;
        margin-top: 20px;
      }

      .chapter-link {
        display: block;
        padding: 10px 14px;
        border: 1px solid rgba(var(--accent-rgb), 0.25);
        border-radius: var(--radius);
        background: rgba(0, 0, 0, 0.25);
        color: rgba(255, 255, 255, 0.7);
        font-family: "Courier New", Courier, monospace;
        font-size: 0.8rem;
        line-height: 1.5;
        letter-spacing: 0.5px;
        text-decoration: none;
        transition: background 0.25s ease, border-color 0.25s ease,
          color 0.25s ease, box-shadow 0.25s ease;
      }

      .chapter-link:hover {
        border-color: var(--accent);
        background: var(--accent-bg-hover);
        color: var(--accent-hover);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.2);
      }

      .chapter-link .chapter-num {
        color: var(--foreground);
        opacity: 0.85;
        transition: color 0.25s ease, opacity 0.25s ease;
      }

      .chapter-link:hover .chapter-num {
        color: var(--accent-hover);
        opacity: 1;
      }

      /* ==================== 响应式 ==================== */
      @media (max-width: 720px) {
        .container { padding: 24px 16px 60px; }
        .site-header .container { padding-top: 12px; padding-bottom: 12px; }
        .header-inner { flex-wrap: wrap; justify-content: center; }
        .book-detail { padding: 18px; }
        .book-title { font-size: 1.35rem; }
        .chapter-grid { grid-template-columns: 1fr; }
        .section-head { margin-top: 2em; }
      }
    </style>
  </head>
  <body>
    <!-- ==================== 顶部固定栏 ==================== -->
    <header class="site-header">
      <div class="container">
        <div class="header-inner">
          <a class="brand" href="../../index.html">Monk</a>
          <nav class="header-nav">
            <a href="../../index.html">首页</a>
            <a href="../../index.html#library">书库</a>
            <a href="../../index.html#tools">工具</a>
            <a href="#">游戏</a>
            <a href="#">布施</a>
            <a href="#">写作</a>
          </nav>
          <div class="search">搜索</div>
        </div>
      </div>
    </header>

    <!-- ==================== 主内容 ==================== -->
    <div class="container">
      <!-- ==================== 书籍信息 + 作品简介 ==================== -->
      <section class="book-detail">
        <h1 class="book-title">离异后被千亿总裁独宠</h1>

        <div class="book-meta">
          <div class="meta-line main">4章 ｜ 9824字 ｜ 完结</div>
          <div class="meta-line">
            <span class="label">最近更新：</span>04 Nov 2569 BE
          </div>
          <div class="meta-line">
            <span class="label">最新章节：</span>第 4 章
          </div>
        </div>

        <div class="book-intro">
          <div class="book-intro-title">作品简介</div>
          <p></p>
        </div>
      </section>

      <!-- ==================== 章节目录 ==================== -->
      <div class="section-head" id="chapters">
        <h2 class="title">章节目录</h2>
        <span class="count">共 4 章</span>
      </div>
      <hr class="line-dashed" />

      <div class="chapter-grid">
        <a href="./001.html" class="chapter-link">
          <span class="chapter-num">第 001 章</span>
        </a>
        <a href="./002.html" class="chapter-link">
          <span class="chapter-num">第 002 章</span>
        </a>
        <a href="./003.html" class="chapter-link">
          <span class="chapter-num">第 003 章</span>
        </a>
        <a href="./004.html" class="chapter-link">
          <span class="chapter-num">第 004 章</span>
        </a>
      </div>
    </div>
  </body>
</html>
